<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinAI - Asisten Keuangan Pintar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <style>
    body { background: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .sheet-table th { background: #111827; border: 1px solid #1f2937; position: sticky; top: 0; z-index: 10; }
    .sheet-table td { border: 1px solid #1f2937; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulse-red { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.1); } }
    .recording-active { animation: pulse-red 1s infinite; background-color: #e11d48 !important; color: white !important; }
  </style>
</head>
<body class="text-slate-200 text-xs min-h-screen flex flex-col justify-between">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="min-h-screen flex flex-col items-center justify-center p-4 relative">
    <div class="w-full max-w-sm flex flex-col items-center text-center space-y-6">
      <div class="w-20 h-20 rounded-3xl bg-emerald-950/70 border border-emerald-500/30 text-emerald-400 flex items-center justify-center text-3xl shadow-2xl"><i class="fas fa-wallet"></i></div>
      <div><h1 class="text-2xl font-black text-slate-100">FinAI</h1><p class="text-xs text-slate-400 mt-0.5">Cloud Sync Ready</p></div>
      
      <div class="w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-5">
        <button onclick="loginWithGoogle()" class="w-full bg-white hover:bg-slate-100 active:scale-[0.98] text-slate-900 font-bold py-3.5 px-4 rounded-2xl flex items-center justify-center gap-3 transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          <span id="login-btn-label">Masuk dengan Google</span>
        </button>
        <button onclick="continueOffline()" class="text-[10px] text-slate-500 hover:text-slate-300 underline">Mode Offline</button>
      </div>
    </div>
  </div>

  <!-- DASHBOARD UTAMA -->
  <div id="main-app" class="hidden min-h-screen flex flex-col justify-between p-2 md:p-4">
    
    <!-- Header Utama -->
    <header class="bg-slate-900 border border-slate-800 rounded-2xl p-3 mb-3 space-y-2.5">
      <div class="flex justify-between pb-2 border-b border-slate-800">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold overflow-hidden">
            <img id="user-photo" class="hidden w-full h-full object-cover"><span id="user-initial">W</span>
          </div>
          <div><h1 id="user-display-name" class="font-black text-slate-100 uppercase">Nama</h1><p id="user-display-email" class="text-[10px] text-slate-400">Email</p></div>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="openBudgetModal()" class="bg-slate-800 p-1.5 rounded-lg"><i class="fas fa-sliders text-cyan-400"></i></button>
          <button onclick="openApiKeyModal()" class="bg-slate-800 p-1.5 rounded-lg"><i class="fas fa-key text-amber-400"></i></button>
          <button onclick="logoutGoogle()" class="bg-rose-950/60 p-1.5 rounded-lg"><i class="fas fa-arrow-right-from-bracket text-rose-300"></i></button>
        </div>
      </div>

      <!-- SALDO CASH UTAMA -->
      <div class="bg-gradient-to-r from-emerald-950 to-slate-900 border border-emerald-800/50 rounded-xl p-3 flex items-center justify-between">
        <div><span class="text-[10px] text-emerald-400 font-bold block mb-0.5">TOTAL SALDO CASH</span><span id="stat-balance" class="text-xl font-black text-white">Rp 0</span></div>
        <div class="w-10 h-10 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400 text-lg"><i class="fas fa-sack-dollar"></i></div>
      </div>

      <!-- Metrics -->
      <div class="grid grid-cols-3 gap-2 font-mono">
        <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2 text-center"><span class="text-[9px] text-slate-500">MASUK</span><span id="stat-income" class="text-[11px] font-bold text-emerald-400 block">Rp 0</span></div>
        <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2 text-center"><span class="text-[9px] text-slate-500">KELUAR</span><span id="stat-expense" class="text-[11px] font-bold text-rose-400 block">Rp 0</span></div>
        <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2 text-center"><span class="text-[9px] text-slate-500">JATAH HARI INI</span><span id="stat-daily-allowance" class="text-[11px] font-bold text-cyan-400 block">Rp 0</span></div>
      </div>

      <!-- Tabs Nav -->
      <div class="grid grid-cols-3 gap-1 pt-1">
        <button onclick="switchTab('chat')" id="tab-btn-chat" class="py-1.5 font-bold rounded-lg text-[11px] text-emerald-400 bg-emerald-950/60 border border-emerald-800/80"><i class="fas fa-microphone"></i> Catat</button>
        <button onclick="switchTab('charts')" id="tab-btn-charts" class="py-1.5 font-bold rounded-lg text-[11px] text-slate-400 bg-slate-950 border border-slate-800"><i class="fas fa-chart-pie"></i> Analisis</button>
        <button onclick="switchTab('history')" id="tab-btn-history" class="py-1.5 font-bold rounded-lg text-[11px] text-slate-400 bg-slate-950 border border-slate-800"><i class="fas fa-table-list"></i> Riwayat</button>
      </div>
    </header>

    <!-- Tab 1: Chat -->
    <section id="tab-chat" class="flex-1 flex flex-col justify-between w-full max-w-2xl mx-auto">
      <div id="chat-box" class="flex-1 bg-slate-900/70 border border-slate-800 rounded-2xl p-3.5 space-y-3 overflow-y-auto max-h-[45vh]"></div>
      <div class="mt-3 space-y-2">
        <input type="file" id="receipt-file-input" accept="image/*" capture="environment" class="hidden" onchange="handleReceiptUpload(event)">
        <form onsubmit="handleUserInput(event)" class="flex items-center gap-1.5">
          <button type="button" id="btn-voice" onclick="toggleVoiceRecording()" class="bg-slate-900 border border-slate-700 w-10 h-10 rounded-xl"><i class="fas fa-microphone"></i></button>
          <button type="button" onclick="document.getElementById('receipt-file-input').click()" class="bg-slate-900 border border-slate-700 text-cyan-400 w-10 h-10 rounded-xl"><i class="fas fa-camera"></i></button>
          <input type="text" id="chat-input" placeholder="Ketik pengeluaran..." required class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 focus:outline-none">
          <button type="submit" class="bg-emerald-600 font-bold px-4 py-2 rounded-xl h-10"><i class="fas fa-paper-plane"></i></button>
        </form>
      </div>
    </section>

    <!-- Tab 2: Chart -->
    <section id="tab-charts" class="hidden flex-1 w-full max-w-2xl mx-auto space-y-3">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><div class="w-full h-[220px] relative"><canvas id="categoryChart"></canvas></div></div>
    </section>

    <!-- Tab 3: History -->
    <section id="tab-history" class="hidden flex-1 w-full max-w-4xl mx-auto">
      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
        <div class="overflow-x-auto max-h-[60vh]">
          <table class="sheet-table w-full text-left font-mono text-[11px]">
            <tbody id="history-table-body" class="divide-y divide-slate-800"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <!-- Modals -->
  <div id="api-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-3 z-50">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-4 space-y-3">
      <div class="flex justify-between"><h3 class="font-bold text-slate-100">API Key OpenRouter</h3><button onclick="closeApiKeyModal()" class="text-slate-400"><i class="fas fa-times"></i></button></div>
      <input type="password" id="input-api-key" placeholder="sk-or-v1-..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5">
      <button onclick="saveApiKey()" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-xl">Simpan</button>
    </div>
  </div>

  <div id="budget-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-3 z-50">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-4 space-y-3">
      <div class="flex justify-between"><h3 class="font-bold text-slate-100">Batas Anggaran</h3><button onclick="closeBudgetModal()" class="text-slate-400"><i class="fas fa-times"></i></button></div>
      <input type="number" id="input-monthly-budget" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-amber-400 font-bold">
      <button onclick="saveBudget()" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-xl">Simpan</button>
    </div>
  </div>

  <!-- Import Modul Eksternal Kita -->
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
